name: Character Daily Bot

on:
  schedule:
    # 毎日日本時間 12:15 (UTC 3:15) に実行
    - cron: '15 3 * * *'
  workflow_dispatch: # 手動実行用ボタン

jobs:
  post_character:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install atproto python-dotenv Pillow

      - name: Run bot
        env:
          HANDLE: ${{ secrets.HANDLE }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: python character.py
