name: Fuwamoko Empathy Bot

on:
  schedule:
    - cron: '30 1 * * *'  # ← UTCで10:30 JST（日本時間朝10:30）
  workflow_dispatch:

concurrency:
  group: fuwamoko-empathy
  cancel-in-progress: true

jobs:
  run-fuwamoko-empathy-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ← 重要！全履歴を取る

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install numpy==1.24.4
          pip install -r requirements.txt
          pip install torch==2.0.1 torchvision transformers==4.36.2 opencv-python pillow groq==0.9.0 httpx==0.27.2 filelock atproto python-dotenv

      - name: Run Fuwamoko Empathy Bot
        env:
          HANDLE: ${{ secrets.HANDLE }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          python fuwamoko_empathy_bot.py

      - name: Git pull & Commit fuwamoko_uris（衝突回避版）
        run: |
          git config --global user.name 'Fuwamoko Bot'
          git config --global user.email 'bot@example.com'
          
          git pull origin main --rebase || git pull origin main --rebase  # ← 強制rebase
          
          git add fuwamoko_empathy_uris.txt
          git commit -m "Update fuwamoko_uris.txt [skip ci]" || echo "No changes to commit"
          
          git push origin main || git push origin main  # 2回目は大体通る