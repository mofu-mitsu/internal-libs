name: 💭 Emotion Bot

on:
  schedule:
    - cron: '5 23 * * *'  # JST 8:05
  workflow_dispatch:

jobs:
  run-emotion-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: 🧹 pipキャッシュをクリア
        run: |
          pip cache purge

      - name: 🐍 Pythonセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 ライブラリをインストール
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir atproto python-dotenv groq==1.6.0 httpx==0.27.2
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 📋 Groq SDKバージョン確認
        run: python -m pip show groq

      - name: 🔐 シークレットを書き出し
        run: |
          echo "HANDLE=${{ secrets.HANDLE }}" >> .env
          echo "APP_PASSWORD=${{ secrets.APP_PASSWORD }}" >> .env
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env

      - name: 📋 確認のためパッケージ一覧を表示
        run: pip list

      - name: 🚀 Botを実行
        run: python post_emotion.py
