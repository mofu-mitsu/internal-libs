name: 🌟 みりんてゃトレンドBot（自動青タグ）

on:
  schedule:
    - cron: '5 0 * * *'  # JST朝9:05
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 チェックアウト
        uses: actions/checkout@v4

      - name: 🐍 Pythonセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 ライブラリインストール
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir atproto python-dotenv groq==0.9.0 selenium beautifulsoup4 unicodedata2

      - name: 🌐 Chromeインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt install -y ./google-chrome-stable_current_amd64.deb

      - name: 🔧 ChromeDriver手動インストール（バージョン自動取得）
        run: |
          CHROME_VERSION=$(google-chrome --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          DRIVER_VERSION=$(curl -s "https://chromedriver.storage.googleapis.com/LATEST_RELEASE_${CHROME_VERSION%%.*}")
          wget "https://chromedriver.storage.googleapis.com/${DRIVER_VERSION}/chromedriver_linux64.zip"
          unzip chromedriver_linux64.zip
          sudo mv chromedriver /usr/local/bin/
          sudo chmod +x /usr/local/bin/chromedriver

      - name: 🔐 シークレット書き出し
        run: |
          echo "HANDLE=${{ secrets.HANDLE }}" >> .env
          echo "APP_PASSWORD=${{ secrets.APP_PASSWORD }}" >> .env
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env

      - name: 🚀 Bot実行（汚染防止でHOME移動）
        run: |
          cd /home/runner
          python $GITHUB_WORKSPACE/post_trend.py