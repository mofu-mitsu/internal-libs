name: 🌟 みりんてゃトレンドBot（気分ラベル）

on:
  schedule:
    - cron: '5 0 * * *'  
  workflow_dispatch:

jobs:
  run-trend-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: 🧹 pipキャッシュクリア
        run: |
          pip cache purge || true

      - name: 🐍 Pythonセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 ライブラリインストール
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir urllib3<2.0.0
          python -m pip install --no-cache-dir atproto python-dotenv groq==0.9.0 httpx==0.27.2 beautifulsoup4 lxml pytz pytrends selenium webdriver-manager

      - name: 🌐 Chrome をインストール（stable）
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip ca-certificates fonts-liberation libasound2
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt install -y ./google-chrome-stable_current_amd64.deb || sudo apt-get -f install -y

      - name: 🔧 確認: pip ライブラリ一覧（デバッグ用）
        run: |
          python -m pip show selenium || true
          python -m pip show webdriver-manager || true
          python -m pip list

      - name: 🔐 シークレット書き出し
        run: |
          echo "HANDLE=${{ secrets.HANDLE }}" >> .env
          echo "APP_PASSWORD=${{ secrets.APP_PASSWORD }}" >> .env
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env

      - name: 🚀 Bot実行
        run: python post_trend.py