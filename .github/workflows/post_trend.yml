name: 🌟 みりんてゃトレンドBot（自動青タグ・不死身版）

on:
  schedule:
    - cron: '5 0 * * *'  # JST朝9:05
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 チェックアウト
        uses: actions/checkout@v4

      - name: 🐍 Pythonセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 ライブラリインストール
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir atproto python-dotenv groq==0.9.0 selenium unicodedata2 pytz

      - name: 🌐 Chrome自動インストール
        uses: browser-actions/setup-chrome@v1

      - name: 🔧 ChromeDriver自動マッチ
        uses: nanasess/setup-chromedriver@v2

      - name: 🔐 シークレット書き出し
        run: |
          echo "HANDLE=${{ secrets.HANDLE }}" >> .env
          echo "APP_PASSWORD=${{ secrets.APP_PASSWORD }}" >> .env
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env

      - name: 🚀 Bot実行
        run: |
          export PATH="$PATH:/usr/local/bin"
          python post_trend.py