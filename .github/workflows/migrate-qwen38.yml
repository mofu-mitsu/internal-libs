name: migrate-qwen38
on:
  pull_request_target:
    types: [opened]
permissions:
  contents: write
  pull-requests: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Migrate Qwen 3.8
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          headers = {'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          files = ['post_emotion.py', 'post_trend.py', 'reply_bot.py', 'fuwamoko_empathy_bot.py']
          for path in files:
              url = f'https://api.github.com/repos/{repo}/contents/{path}'
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  data = json.load(r)
              import base64
              content = base64.b64decode(data['content']).decode('utf-8')
              new = content.replace('qwen/qwen3.6-27b', 'qwen/qwen3.8-27b').replace('                    reasoning_effort="none",\n', '')
              if new == content:
                  print(f'No change: {path}')
                  continue
              payload = json.dumps({'message': 'chore: unify Mirinteya bots on Qwen 3.8', 'content': base64.b64encode(new.encode()).decode(), 'sha': data['sha'], 'branch': 'main'}).encode()
              put = urllib.request.Request(url, data=payload, headers={**headers, 'Content-Type': 'application/json'}, method='PUT')
              with urllib.request.urlopen(put) as r:
                  print(f'Updated {path}: {r.status}')
          # Remove this temporary workflow from main.
          url = f'https://api.github.com/repos/{repo}/contents/.github/workflows/migrate-qwen38.yml'
          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req) as r:
              wf = json.load(r)
          payload = json.dumps({'message': 'chore: remove temporary migration workflow', 'sha': wf['sha'], 'branch': 'main'}).encode()
          delete = urllib.request.Request(url, data=payload, headers={**headers, 'Content-Type': 'application/json'}, method='DELETE')
          with urllib.request.urlopen(delete) as r:
              print(f'Removed workflow: {r.status}')
          PY
