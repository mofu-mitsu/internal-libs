name: Mirin-tya Daily Life Bot

on:
  schedule:
    # 毎日日本時間 18:30 (UTC 9:30) に実行
    # 末尾の '1-5' が「月〜金」という意味だよ！
    - cron: '30 9 * * 1-5'
  workflow_dispatch:

jobs:
  post_daily:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install atproto python-dotenv Pillow

      - name: Run bot
        env:
          HANDLE: ${{ secrets.HANDLE }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: python daily.py
