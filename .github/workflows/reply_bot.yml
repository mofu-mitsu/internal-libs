name: Bluesky Reply

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: bluesky-reply
  cancel-in-progress: false

jobs:
  run-reply-bot:
    # Ubuntuは22.04に固定（latestは24.04で不安定な可能性あり）
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Clear HuggingFace cache
        run: |
          rm -rf ~/.cache/huggingface

      - name: Clear pip cache
        run: |
          pip cache purge

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU版PyTorchを公式wheelからインストール（欠損回避）
          pip install torch==2.2.0+cpu torchvision==0.17.0+cpu --index-url https://download.pytorch.org/whl/cpu
          # TransformersとAccelerateは安定版に固定
          pip install transformers==4.36.2 accelerate==0.29.2 psutil==5.9.8 sentencepiece==0.2.0
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Check installed packages
        run: |
          python -c "import sys, torch; print('Python', sys.version); print('Torch', torch.__version__, 'uint64 exists?', hasattr(torch,'uint64'))"
          pip list

      - name: Run Reply Bot
        env:
          HANDLE: ${{ secrets.HANDLE }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
          GIST_TOKEN_REPLY: ${{ secrets.GIST_TOKEN_REPLY }}
          GIST_ID: 40391085a2e0b8a48935ad0b460cf422
        run: |
          # HF_TOKENを環境変数に渡す（ELYZAは認証不要だけど保険）
          export HUGGINGFACE_TOKEN="${HF_API_TOKEN}"
          python reply_bot.py