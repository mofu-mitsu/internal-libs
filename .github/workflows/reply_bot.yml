name: Bluesky Reply

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: bluesky-reply
  cancel-in-progress: false

jobs:
  run-reply-bot:
    runs-on: ubuntu-latest  # ★予算OKならこれ（無料プランならubuntu-latest）

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Cache HuggingFace models
        uses: actions/cache@v3
        with:
          path: /tmp/hf_cache
          key: hf-cache-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            hf-cache-

      - name: Clear old cache
        run: rm -rf ~/.cache/huggingface

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install torch diffusers accelerate sentencepiece psutil pytz huggingface_hub

      - name: Check Groq SDK version
        run: |
          python -m pip show groq

      - name: Run Reply Bot with Groq
        env:
          HANDLE: ${{ secrets.HANDLE }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GIST_TOKEN_REPLY: ${{ secrets.GIST_TOKEN_REPLY }}
          GIST_ID: 40391085a2e0b8a48935ad0b460cf422
          HF_TOKEN: ${{ secrets.HF_API_TOKEN }}
          DEEPAI_API_KEY: ${{ secrets.DEEPAI_API_KEY }}  # 追加
          STABLE_HORDE_API_KEY: ${{ secrets.STABLE_HORDE_API_KEY }}  # 追加
        run: python reply_bot.py
