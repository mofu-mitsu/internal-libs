name: Mirinteya Poem Bot

on:
  schedule:
    # 毎日日本時間 22:00 (UTC 13:00) に実行
    - cron: '0 13 * * *'
  workflow_dispatch: # 手動でも動かせるボタン

jobs:
  post_poem:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install atproto python-dotenv groq==1.6.0
      - name: Check Groq SDK version
        run: python -m pip show groq
      - name: Run bot
        env:
          HANDLE: ${{ secrets.HANDLE }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python poem_bot.py
